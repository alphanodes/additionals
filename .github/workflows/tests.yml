name: Tests
on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.redmine }} ${{ matrix.db }} ruby-${{ matrix.ruby }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        ruby: ['3.3', '3.4', '4.0']
        redmine: ['7.0-stable', 'master']
        # Ruby compatibility does not depend on the database, so the full ruby
        # matrix runs on the current PostgreSQL only. Every other database gets
        # two jobs, which is enough to catch adapter and dialect differences.
        db: ['postgres']
        include:
          - ruby: '3.4'
            redmine: '7.0-stable'
            db: 'mysql'
          - ruby: '3.4'
            redmine: 'master'
            db: 'mysql'
          # MariaDB is the mysql variant most Redmine installations actually run,
          # since Debian and Ubuntu ship it instead of MySQL.
          - ruby: '3.4'
            redmine: '7.0-stable'
            db: 'mariadb'
          - ruby: '3.4'
            redmine: 'master'
            db: 'mariadb'
          # Pins the oldest PostgreSQL we claim to support in the README,
          # otherwise that claim is never verified.
          - ruby: '3.4'
            redmine: '7.0-stable'
            db: 'postgres16'
          - ruby: '3.4'
            redmine: 'master'
            db: 'postgres16'
      fail-fast: false

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres16:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          # will assign a random free host port
          - 5432/tcp

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: 'BestPasswordEver'
        ports:
          # will assign a random free host port
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: 'BestPasswordEver'
        ports:
          # will assign a random free host port
          - 3306/tcp
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Verify MySQL connection from host
        run: |
          mysql --host 127.0.0.1 --port ${{ job.services.mysql.ports[3306] }} -uroot -pBestPasswordEver -e "SHOW DATABASES"
        if: matrix.db == 'mysql'

      - name: Verify MariaDB connection from host
        run: |
          mysql --host 127.0.0.1 --port ${{ job.services.mariadb.ports[3306] }} -uroot -pBestPasswordEver -e "SELECT VERSION()"
        if: matrix.db == 'mariadb'

      - name: Verify PostgreSQL 16 connection from host
        run: |
          PGPASSWORD=postgres psql --host 127.0.0.1 --port ${{ job.services.postgres16.ports[5432] }} -U postgres -c "SELECT version()"
        if: matrix.db == 'postgres16'

      - name: Checkout Redmine
        uses: actions/checkout@v5
        with:
          repository: redmine/redmine
          ref: ${{ matrix.redmine }}
          path: redmine

      - name: Checkout additionals
        uses: actions/checkout@v5
        with:
          repository: AlphaNodes/additionals
          path: redmine/plugins/additionals

      - name: Update package archives
        run: sudo apt-get update --yes --quiet

      - name: Install package dependencies
        run: >
          sudo apt-get install --yes --quiet
          build-essential
          cmake
          libicu-dev
          libpq-dev
          libmysqlclient-dev

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically

      - name: Prepare Redmine source
        working-directory: redmine
        run: |
          cp plugins/additionals/test/support/database-${{ matrix.db }}.yml config/database.yml
          cp plugins/additionals/test/support/configuration.yml config/configuration.yml
          cp plugins/additionals/test/support/additional_environment.rb config/additional_environment.rb

      - name: Setup Gemfile
        working-directory: redmine/plugins/additionals
        run: |
          touch .enable_test

      - name: Install Ruby dependencies
        working-directory: redmine
        run: |
          bundle config set --local without 'development'
          bundle install --jobs=4 --retry=3

      - name: Run Redmine rake tasks
        env:
          RAILS_ENV: test
          MYSQL_PORT: ${{ job.services.mysql.ports[3306] }}
          MARIADB_PORT: ${{ job.services.mariadb.ports[3306] }}
          POSTGRES16_PORT: ${{ job.services.postgres16.ports[5432] }}
        working-directory: redmine
        run: |
          bundle exec rake generate_secret_token
          bundle exec rake db:create db:migrate redmine:plugins:migrate

      - name: Run tests
        env:
          RAILS_ENV: test
          MYSQL_PORT: ${{ job.services.mysql.ports[3306] }}
          MARIADB_PORT: ${{ job.services.mariadb.ports[3306] }}
          POSTGRES16_PORT: ${{ job.services.postgres16.ports[5432] }}
        working-directory: redmine
        run: bundle exec rake redmine:plugins:test NAME=additionals RUBYOPT="-W0"

      - name: Run uninstall test
        env:
          RAILS_ENV: test
          MYSQL_PORT: ${{ job.services.mysql.ports[3306] }}
          MARIADB_PORT: ${{ job.services.mariadb.ports[3306] }}
          POSTGRES16_PORT: ${{ job.services.postgres16.ports[5432] }}
        working-directory: redmine
        run: bundle exec rake redmine:plugins:migrate NAME=additionals VERSION=0
