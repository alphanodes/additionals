# FontAwesome to Tabler icon name mapping.
#
# Keys are the FontAwesome icon name (the "<name>" part of a stored value
# "fas_<name>" / "far_<name>" / "fab_<name>"); values are the target Tabler
# sprite icon name (id in the additionals icons.svg / icons_custom.svg sprite).
#
# Used to migrate stored icon values away from FontAwesome and to render legacy
# values tolerantly until migrated. Values without a sensible Tabler equivalent
# map to the fallback icon "point". Long-tail entries are best-effort; instance
# admins refine icons after migration.
#
# TODO (finish-up): salesforce currently -> point (no simple-icons SVG / no
# tabler brand). Add a custom SVG + change the mapping when available.
