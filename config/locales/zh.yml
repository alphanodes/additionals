  rule_issue_freezed_with_close_info: "启用此选项后，已关闭的问题不能再编辑和评论，通过邮件或 API 也不行。具有\"编辑已关闭的问题\"权限的角色不受此限制。"
  rule_issue_status_change_info: "使用场景：当状态变为\"Approval\"时，问题自动指派给其作者。"
  rule_issue_timelog_required_info_html: "所选跟踪标签的每个问题若要变为所定义的状态之一，必须已登记工时。以下情况无需登记工时：<br />- 没有登记工时的权限<br />- 用户具有\"无需登记工时\"权限<br />使用场景：验收状态为\"To Verify\"的问题时，也需要已花费的时间。"
